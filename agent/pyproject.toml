[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "networkguard-agent"
version = "0.1.0"
description = "Linux monitoring agent for the NetworkGuard platform"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9,<8.0"]

[project.scripts]
networkguard-agent = "networkguard_agent.agent:main"

[tool.setuptools.packages.find]
where = ["."]
